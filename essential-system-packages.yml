- name: Install various utility packages
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - apt:
        package:
          - git
          - curl
          - wget
          - ranger # command-line file manager
          - build-essential
          - flip
          - htop
          - jq # for manipulating json
          - openssh-server
          - tree
        state: latest
